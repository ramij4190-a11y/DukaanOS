name: DukaanOS CI/CD Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-verify:
    name: Run Automated Test Suites
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Test Suite
        env:
          DATABASE_URL: "sqlite:///:memory:"
          SECRET_KEY: "ci_testing_secret_key"
        run: |
          python -m pytest dukaanos/tests/ -v --maxfail=1

      - name: Verify Dockerfile Build
        run: |
          docker build -t dukaanos-api:test -f dukaanos/Dockerfile .

